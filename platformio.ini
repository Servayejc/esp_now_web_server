; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; https://github.com/Servayejc/esp_now_web_server

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 74880
upload_port = COM10
monitor_port = COM10
monitor_filters = log2file, time, esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_flags = 
	-I ../secure_directory	; point to your secure directory containing your Credential.h 
	
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.7.7
	esp32async/AsyncTCP@^3.4.0
	bblanchon/ArduinoJson@^6.18.3
	contrem/arduino-timer@^3.0.0
	sstaub/TickTwo@^4.4.0
	plageoj/UrlEncode@^1.0.1
	mobizt/ESP Mail Client@^3.4.24
