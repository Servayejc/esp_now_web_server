    .status{background-color:green; margin-left:4px; margin-right:4px; border:2px; width:40px;  height:20px; border:1px;}
    .statusRect {display: flex; justify-content: center; }
    .heat {color: #ff2200; display: none;}
    .heating {display: inline; color: black;}

       
    .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }
      
      .switch input { 
        opacity: 0;
        width: 0;
        height: 0;
      }
      
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
      }
      
      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
      }
      
      .play{
         animation: flashing 2s ease; 
         animation-iteration-count: 3;
       }
      
      @keyframes flashing {
        0% {box-shadow: 2px 2px 12px 1px rgba(255, 1, 1, 0.5);}
        100% { box-shadow: 2px 2px 12px 1px rgba(116, 116, 116, 0.996);}
      } 

      input:checked + .slider {
        background-color: #2196F3;
      }
      
      input:focus + .slider {
        box-shadow: 0 0 1px #2196F3;
      }
      
      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }
      
      /* Rounded sliders */
      .slider.round {
        border-radius: 34px;
      }
      
      .slider.round:before {
        border-radius: 50%;
      }


    .progress-container {
      width: 300px;
      height: 30px;
      background-color: #ddd;
      border-radius: 20px;
      overflow: hidden;
	  margin: 0 auto;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      text-align: center;
      line-height: 30px;
      color: white;
      transition: width 0.3s ease;
    }

<script>
document.getHTML = function(element, includeDescendants) {
    if (!element || !element.tagName) return '';
    var tempDiv = document.createElement("div");
    tempDiv.appendChild(element.cloneNode(false));
    var resultString = tempDiv.innerHTML;
    if (includeDescendants) {
        var position = resultString.indexOf('>') + 1;
        resultString = resultString.substring(0, position) + element.innerHTML + resultString.substring(position);
    }
    return resultString;

};
